spring.application.name=retry-service
#SERVER
server.port=6200
server.servlet.context-path=/retry

#RABBITMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest


spring.datasource.url=jdbc:h2:mem:retryDB
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:delta/schema.sql
spring.sql.init.data-locations=classpath:delta/data.sql

spring.jdbc.insert.sql=INSERT INTO MESSAGE_DEAD_HISTORY \
  (CREATED_DATE, EXCHANGE_NAME, QUEUE_NAME, ROUTING_HEADER, MESSAGE_ID, PAYLOAD) VALUES (?, ?, ?, ?, ?, ?)

#DEAD QUEUES
dead.max.retries=3
