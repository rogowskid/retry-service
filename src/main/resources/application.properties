spring.application.name=retry-service
#SERVER
server.port=6200
server.servlet.context-path=/retry

#RABBITMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

#DATABASE
spring.datasource.url=jdbc:h2:mem:retryDB
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:delta/schema.sql
spring.sql.init.data-locations=classpath:delta/data.sql

spring.jdbc.insert.sql=INSERT INTO MESSAGE_DEAD_HISTORY \
  (CREATED_DATE, EXCHANGE_NAME, QUEUE_NAME, ROUTING_HEADER, MESSAGE_ID, PAYLOAD) VALUES (?, ?, ?, ?, ?, ?)

#DEAD QUEUES
dead.max.retries=3

#QUARTZ
spring.quartz.job-store-type=jdbc
spring.quartz.jdbc.initialize-schema=always
spring.quartz.properties.org.quartz.scheduler.instanceName=RetryServiceScheduler
spring.quartz.properties.org.quartz.scheduler.instanceId=AUTO
spring.quartz.properties.org.quartz.threadPool.threadCount=5
spring.quartz.properties.org.quartz.threadPool.class=org.quartz.simpl.SimpleThreadPool
spring.quartz.properties.org.quartz.jobStore.class=org.springframework.scheduling.quartz.LocalDataSourceJobStore
spring.quartz.properties.org.quartz.jobStore.driverDelegateClass=org.quartz.impl.jdbcjobstore.StdJDBCDelegate
spring.quartz.properties.org.quartz.jobStore.useProperties=false
spring.quartz.properties.org.quartz.jobStore.misfireThreshold=60000
spring.quartz.properties.org.quartz.jobStore.isClustered=false