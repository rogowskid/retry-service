spring.application.name=retry-service
#SERVER
server.port=6200
server.servlet.context-path=/retry
#RABBITMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest


#DATABASE
spring.datasource.url=jdbc:h2:mem:retryDB
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create

dead.queues.list=register.tracking.dead.queue,parcels.dead.queue
dead.queue.interval=180000
dead.max.retries=3
